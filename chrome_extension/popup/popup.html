<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PhishGuard-AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon48.png" alt="">
    <div class="brand"><strong>PhishGuard-AI</strong><span id="backend"><i class="dot"></i> Checking server…</span></div>
  </header>

  <section class="verdict" id="verdict">
    <span class="pill neutral" id="pill">Waiting</span>
    <h1 id="headline">No result for this tab yet</h1>
    <p class="host mono" id="host"></p>
    <div class="score"><div class="bar"><span id="bar"></span></div><span id="score"></span></div>
    <p class="explain" id="explain">Open or reload a website, or press Re-scan.</p>
  </section>

  <section class="checks">
    <div class="row"><span>Connection</span><b id="cConn">—</b></div>
    <div class="row"><span>AI URL model (BERT)</span><b id="cBert">—</b></div>
    <div class="row"><span>Mule-account registry</span><b id="cMule">—</b></div>
    <div class="row"><span>Brand impersonation</span><b id="cBrand">—</b></div>
    <div class="row"><span>Logo check (YOLOv8n)</span><b id="cLogo">—</b></div>
    <div class="row"><span>Password / card fields</span><b id="cForm">—</b></div>
  </section>

  <section class="reasons-box">
    <h2>Why</h2>
    <ul id="reasons"><li class="muted">No reasons yet.</li></ul>
  </section>

  <div class="buttons">
    <button id="rescan" class="primary" type="button">Re-scan</button>
    <button id="report" type="button">Report account</button>
    <button id="dashboard" type="button">Dashboard</button>
  </div>

  <details id="settings">
    <summary>Backend settings</summary>
    <label>Server <select id="mode">
      <option value="auto">Automatic (online, then local)</option>
      <option value="online">Online HTTPS server only</option>
      <option value="local">Local server only</option>
    </select></label>
    <label>Online URL <input id="onlineUrl" type="url"></label>
    <label>Local URL <input id="localUrl" type="url"></label>
    <label>API key <input id="apiKey" type="password" autocomplete="off"></label>
    <div class="buttons"><button id="save" class="primary" type="button">Save and test</button><span id="saveMsg" class="muted"></span></div>
  </details>
  <script src="popup.js"></script>
</body>
</html>
