# Local container run:  docker compose up --build   →   http://127.0.0.1:8000/dashboard/
services:
  phishguard:
    build: .
    container_name: phishguard-ai
    restart: unless-stopped
    ports:
      - "8000:10000"
    environment:
      - PHISHGUARD_API_KEY=12345678
      - PHISHGUARD_ADMIN_KEY=12345678
      - PHISHGUARD_DB_PATH=/data/phishguard.db
    volumes:
      - phishguard-data:/data
volumes:
  phishguard-data:
